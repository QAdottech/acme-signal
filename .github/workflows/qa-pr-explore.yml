name: PR exploratory browser QA

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR number (targeting main)'
        type: number
        required: true
      preview_url:
        description: 'Approved reachable HTTPS deployment with real email disabled at build and runtime'
        type: string
        required: true
      deployed_sha:
        description: 'Verified deployed PR head SHA (40 lowercase hex characters)'
        type: string
        required: true
      claude_model:
        description: 'Claude model identifier'
        type: string
        required: true
        default: 'claude-opus-5-5'
      codex_model:
        description: 'Codex model identifier'
        type: string
        required: true
        default: 'gpt-6-sol'
      seconds:
        description: 'Per-agent execution seconds (1–3600)'
        type: number
        required: true
        default: 600
      codex_rates:
        description: 'JSON USD / 1M tokens: {"input":2,"cached":1,"output":8}; verify current model-specific prices'
        type: string
        required: true
      rate_effective_date:
        description: 'Date pricing was checked (YYYY-MM-DD)'
        type: string
        required: true
      approval:
        description: 'Type APPROVE_PAID_QA_SAFE_PREVIEW after verifying target, email/Turnstile safeguards, billing and PR context'
        type: string
        required: true
  deployment_status:

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: pr-qa-${{ github.event_name }}-${{ inputs.pr_number || github.event.deployment.sha || github.run_id }}-${{ inputs.deployed_sha || github.event.deployment_status.id || github.run_attempt }}
  cancel-in-progress: false

jobs:
  context:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approval == 'APPROVE_PAID_QA_SAFE_PREVIEW') ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production' && (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolved.outputs.pr_number }}
      preview_url: ${{ steps.settings.outputs.preview_url }}
      deployed_sha: ${{ steps.settings.outputs.deployed_sha }}
      claude_model: ${{ steps.settings.outputs.claude_model }}
      codex_model: ${{ steps.settings.outputs.codex_model }}
      seconds: ${{ steps.settings.outputs.seconds }}
      codex_rates: ${{ steps.settings.outputs.codex_rates }}
      rate_effective_date: ${{ steps.settings.outputs.rate_effective_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve QA trigger inputs
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || '' }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url || '' }}
          MANUAL_DEPLOYED_SHA: ${{ inputs.deployed_sha || '' }}
          MANUAL_CLAUDE_MODEL: ${{ inputs.claude_model || '' }}
          MANUAL_CODEX_MODEL: ${{ inputs.codex_model || '' }}
          MANUAL_SECONDS: ${{ inputs.seconds || '' }}
          MANUAL_CODEX_RATES: ${{ inputs.codex_rates || '' }}
          MANUAL_RATE_DATE: ${{ inputs.rate_effective_date || '' }}
          AUTO_PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || '' }}
          AUTO_DEPLOYED_SHA: ${{ github.event.deployment.sha || '' }}
          AUTO_CLAUDE_MODEL: ${{ vars.QA_CLAUDE_MODEL || 'claude-opus-5-5' }}
          AUTO_CODEX_MODEL: ${{ vars.QA_CODEX_MODEL || 'gpt-6-sol' }}
          AUTO_SECONDS: ${{ vars.QA_EXPLORE_SECONDS || '600' }}
          AUTO_CODEX_RATES: ${{ vars.QA_CODEX_RATES || '' }}
          AUTO_RATE_DATE: ${{ vars.QA_CODEX_RATE_EFFECTIVE_DATE || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            pr_number="$MANUAL_PR_NUMBER"
            preview_url="$MANUAL_PREVIEW_URL"
            deployed_sha="$MANUAL_DEPLOYED_SHA"
            claude_model="$MANUAL_CLAUDE_MODEL"
            codex_model="$MANUAL_CODEX_MODEL"
            seconds="$MANUAL_SECONDS"
            codex_rates="$MANUAL_CODEX_RATES"
            rate_date="$MANUAL_RATE_DATE"
          else
            pr_number="auto"
            preview_url="$AUTO_PREVIEW_URL"
            deployed_sha="$AUTO_DEPLOYED_SHA"
            claude_model="$AUTO_CLAUDE_MODEL"
            codex_model="$AUTO_CODEX_MODEL"
            seconds="$AUTO_SECONDS"
            codex_rates="$AUTO_CODEX_RATES"
            rate_date="$AUTO_RATE_DATE"
          fi
          [[ "$preview_url" =~ ^https:// ]] || { echo "Preview URL must be HTTPS." >&2; exit 1; }
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployed SHA must be a 40-character lowercase hex commit." >&2; exit 1; }
          [[ "$seconds" =~ ^[0-9]+$ ]] && (( seconds >= 1 && seconds <= 3600 )) || { echo "Seconds must be 1-3600." >&2; exit 1; }
          [[ -n "$claude_model" && -n "$codex_model" ]] || { echo "Model IDs must be configured." >&2; exit 1; }
          {
            echo "pr_number=$pr_number"
            echo "preview_url=$preview_url"
            echo "deployed_sha=$deployed_sha"
            echo "claude_model=$claude_model"
            echo "codex_model=$codex_model"
            echo "seconds=$seconds"
            echo "rate_effective_date=$rate_date"
            echo "codex_rates<<__QA_RATES__"
            printf '%s\n' "$codex_rates"
            echo "__QA_RATES__"
          } >> "$GITHUB_OUTPUT"
      - name: Freeze approved PR context (never checkout PR code)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.settings.outputs.pr_number }}
          DEPLOYED_SHA: ${{ steps.settings.outputs.deployed_sha }}
        run: |
          mkdir -p test-results
          node tests/agent-browser/runner/pr-context.mjs "$REPOSITORY" "$PR_NUMBER" "$DEPLOYED_SHA" test-results/pr-context.md test-results/pr-run.json
      - name: Publish resolved PR metadata
        id: resolved
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync('test-results/pr-run.json', 'utf8'));
          console.log(`pr_number=${metadata.prNumber}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: approved-pr-context
          path: test-results/pr-context.md
          retention-days: 7

  explore:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: claude
          - agent: codex
    name: Explore PR with ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install verified agent CLIs (no authentication yet)
        run: npm install --global @anthropic-ai/claude-code@2.1.123 @openai/codex@0.147.0
      - uses: actions/download-artifact@v4
        with:
          name: approved-pr-context
          path: test-results
      - name: Record explicitly supplied model-specific price card
        env:
          CODEX_MODEL: ${{ needs.context.outputs.codex_model }}
          CODEX_RATES: ${{ needs.context.outputs.codex_rates }}
          RATE_DATE: ${{ needs.context.outputs.rate_effective_date }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const raw = process.env.CODEX_RATES?.trim();
          if (!raw) {
            console.log('No Codex rate card configured; Codex USD will be reported as unknown, not zero.');
            process.exit(0);
          }
          const rates = JSON.parse(raw);
          if (!rates || typeof rates !== 'object' || Array.isArray(rates) ||
              !['input', 'cached', 'output'].every(key => typeof rates[key] === 'number' && Number.isFinite(rates[key]) && rates[key] >= 0)) {
            throw new Error('CODEX_RATES must contain nonnegative numeric input, cached and output USD rates. No model call started.');
          }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(process.env.RATE_DATE ?? '')) throw new Error('RATE_DATE must be YYYY-MM-DD. No model call started.');
          writeFileSync('test-results/codex-rate-card.json', JSON.stringify({
            model: process.env.CODEX_MODEL, effectiveDate: process.env.RATE_DATE,
            inputUsdPerMillion: rates.input, cachedInputUsdPerMillion: rates.cached, outputUsdPerMillion: rates.output,
          }, null, 2));
          NODE
      - name: Run one isolated agent (paid; first failure preserved)
        id: explore
        continue-on-error: true
        env:
          QA_AGENT: ${{ matrix.agent }}
          CLAUDE_MODEL: ${{ needs.context.outputs.claude_model }}
          CODEX_MODEL: ${{ needs.context.outputs.codex_model }}
          TARGET_URL: ${{ needs.context.outputs.preview_url }}
          DEPLOYED_SHA: ${{ needs.context.outputs.deployed_sha }}
          SECONDS: ${{ needs.context.outputs.seconds }}
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_API_KEY: ${{ matrix.agent == 'codex' && secrets.CODEX_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [[ "$QA_AGENT" == "claude" ]]; then MODEL="$CLAUDE_MODEL"; else MODEL="$CODEX_MODEL"; fi
          pnpm qa:explore --agent "$QA_AGENT" --model "$MODEL" \
            --url "$TARGET_URL" --revision "$DEPLOYED_SHA" \
            --charter tests/agent-browser/charters/pr-change.md \
            --context test-results/pr-context.md --seconds "$SECONDS" \
            --execute --confirm-safe-target
      - name: Emit token usage and spend provenance (including blocked runs)
        id: metrics
        if: always()
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
        run: node tests/agent-browser/runner/metrics.mjs run test-results/agent-browser "$PR_NUMBER" test-results/codex-rate-card.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-metrics-${{ matrix.agent }}
          path: test-results/agent-browser/**/metrics.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence-${{ matrix.agent }}
          path: test-results/agent-browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve failure signal after uploading evidence
        if: steps.explore.outcome != 'success' || steps.metrics.outcome != 'success'
        run: exit 1

  compare:
    if: always() && needs.context.result == 'success'
    needs: [context, explore]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-metrics-*
          path: qa-artifacts
      - name: Show side-by-side metrics (not a verdict)
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
        run: node tests/agent-browser/runner/metrics.mjs compare qa-artifacts "$PR_NUMBER"
