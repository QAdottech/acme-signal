name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Lint schema
        run: supabase db lint

      - name: Verify seed data
        run: |
          supabase db query --local "select count(*) as organizations from public.organizations"
          supabase db query --local "select count(*) as deals from public.deals"
          supabase db query --local "select count(*) as users from public.users"

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
